[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aircreator-backend"
version = "0.1.0"
description = "Motor de reconstrução geométrica 3D aeronáutica a partir de blueprints"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AirCreator Team" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
